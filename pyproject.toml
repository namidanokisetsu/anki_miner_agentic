[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "anki-miner-companion"
version = "0.2.0"
description = "Agent workflow for Anki Miner"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = []

[tool.setuptools]
py-modules = ["miner", "candidates", "transport"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-third-party = ["anki_miner"]

[tool.black]
line-length = 110
