[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "anki-miner-lean"
version = "0.1.0"
description = "A small agent companion to Anki Miner's public API"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["pysubs2>=1.8,<2", "fugashi>=1.5,<2", "unidic-lite>=1.0.8,<2"]

[project.scripts]
anki-lean = "miner:main"

[tool.setuptools]
py-modules = ["miner", "candidates", "transport"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
line-length = 110
