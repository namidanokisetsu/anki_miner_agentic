name: CI
on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . ruff
      - run: python -m ruff check .
      - run: python -m unittest discover -s tests -v

  upstream:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ref: ["476ee5e43743ae4e6140ef6d0041099d4a3511a4", "main"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check out upstream separately
        uses: actions/checkout@v4
        with:
          repository: 0xzerolight/anki_miner
          ref: ${{ matrix.ref }}
          path: upstream-test
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install ./upstream-test
      - run: python -m unittest discover -s tests -v
        env:
          ANKI_MINER_TEST_SOURCE: ${{ github.workspace }}/upstream-test
          QT_QPA_PLATFORM: offscreen
